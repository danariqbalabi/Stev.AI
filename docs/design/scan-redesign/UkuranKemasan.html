<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Ukuran minuman kemasan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f5f5f7; font-family: Onest, -apple-system, system-ui, sans-serif; color: #111113">
<div style="position: absolute; top: 0; left: 0; right: 0; height: 380px; background: #e8e8ed; display: flex; align-items: center; justify-content: center; color: #6e6e73; font-size: 13px; font-weight: 600">[foto Ultra Milk]</div>
<button aria-label="Kembali ke kamera" style="position: absolute; top: 56px; left: 20px; width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.28); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div style="position: absolute; top: 340px; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.72); backdrop-filter: blur(28px) saturate(180%); border-top: 1px solid rgba(255,255,255,0.9); border-radius: 36px 36px 0 0; box-shadow: 0 -10px 30px -12px rgba(17,17,19,0.12); padding: 28px 20px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -0.01em">Ultra Milk Cokelat</div>
<div style="font-size: 13px; line-height: 18px; font-weight: 600; color: #6e6e73">Ukurannya berapa?</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 56px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.55); font-family: inherit; font-size: 16px; font-weight: 600; color: #6e6e73">125 ml</button>
<button style="height: 56px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.55); font-family: inherit; font-size: 16px; font-weight: 600; color: #6e6e73">200 ml</button>
<button aria-label="250 ml, terpilih dari foto" style="height: 56px; border-radius: 20px; border: 0; background: #ffffff; box-shadow: 0 4px 0 0 #e1e1e6; outline: 2px solid #111113; font-family: inherit; color: #111113; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">
<span style="font-size: 16px; font-weight: 700">250 ml</span>
<span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #6e6e73">tebakan dari foto</span>
</button>
<button style="height: 56px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.55); font-family: inherit; font-size: 16px; font-weight: 600; color: #6e6e73">1 liter</button>
</div>
<div style="display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-top: 8px">
<span style="font-size: 40px; line-height: 44px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">24</span>
<span style="font-size: 17px; font-weight: 700; color: #6e6e73">g gula</span>
</div>
<a href="Hasil.html" style="height: 56px; border-radius: 20px; background: #111113; color: #ffffff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Lihat hasil</a>
</div>
</div>
</body>
</html>
