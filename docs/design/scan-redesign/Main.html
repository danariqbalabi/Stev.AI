<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Kamera Stev.AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1c1c1f; font-family: Onest, -apple-system, system-ui, sans-serif; color: #ffffff">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6e6e73; font-size: 13px; font-weight: 600">[pratinjau kamera]</div>
<div style="position: absolute; top: 56px; left: 20px; right: 20px; display: flex; justify-content: space-between">
<button aria-label="Tutup" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.28); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<button aria-label="Lampu kilat" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.28); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"></path></svg>
</button>
</div>
<div style="position: absolute; top: 210px; left: 55px; width: 280px; height: 280px">
<div style="position: absolute; top: 0; left: 0; width: 44px; height: 44px; border-top: 4px solid #ffffff; border-left: 4px solid #ffffff; border-top-left-radius: 28px"></div>
<div style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; border-top: 4px solid #ffffff; border-right: 4px solid #ffffff; border-top-right-radius: 28px"></div>
<div style="position: absolute; bottom: 0; left: 0; width: 44px; height: 44px; border-bottom: 4px solid #ffffff; border-left: 4px solid #ffffff; border-bottom-left-radius: 28px"></div>
<div style="position: absolute; bottom: 0; right: 0; width: 44px; height: 44px; border-bottom: 4px solid #ffffff; border-right: 4px solid #ffffff; border-bottom-right-radius: 28px"></div>
</div>
<div style="position: absolute; top: 520px; left: 0; right: 0; display: flex; justify-content: center">
<div style="padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.28); border: 1px solid rgba(255,255,255,0.5); backdrop-filter: blur(20px); font-size: 15px; font-weight: 600">Arahkan ke minuman atau barcode</div>
</div>
<div style="position: absolute; bottom: 64px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 56px">
<button aria-label="Pilih dari galeri" style="width: 52px; height: 52px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.28); display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
</button>
<button aria-label="Foto minuman" style="width: 80px; height: 80px; border-radius: 999px; border: 4px solid #ffffff; background: transparent; padding: 5px; display: flex">
<span style="flex: 1; border-radius: 999px; background: #ffffff"></span>
</button>
<div style="width: 52px; height: 52px"></div>
</div>
</div>
</body>
</html>
