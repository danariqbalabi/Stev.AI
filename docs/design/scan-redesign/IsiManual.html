<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Isi manual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f5f5f7; font-family: Onest, -apple-system, system-ui, sans-serif; color: #111113">
<div aria-hidden="true" style="position: absolute; top: -40px; left: -80px; width: 240px; height: 240px; border-radius: 999px; background: rgba(52,208,127,0.34); filter: blur(70px)"></div>
<div aria-hidden="true" style="position: absolute; bottom: 120px; right: -90px; width: 260px; height: 260px; border-radius: 999px; background: rgba(224,112,8,0.20); filter: blur(70px)"></div>
<div style="position: relative; height: 844px; box-sizing: border-box; padding: 56px 20px 48px; display: flex; flex-direction: column; gap: 28px">
<button aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.72); display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div style="font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.02em">Isi dari label</div>
<div style="background: rgba(255,255,255,0.55); backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,0.9); border-radius: 28px; box-shadow: 0 1px 2px 0 rgba(17,17,19,0.04), 0 12px 32px -8px rgba(17,17,19,0.10); padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-nama" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #6e6e73">Nama minuman</label>
<input id="m-nama" placeholder="Contoh: teh melati kotak" style="height: 52px; border-radius: 20px; border: 1px solid #e8e8ed; background: #ffffff; padding: 0 16px; font-family: inherit; font-size: 16px; font-weight: 600; color: #111113; box-sizing: border-box">
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-gula" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #6e6e73">Gula per sajian</label>
<input id="m-gula" placeholder="g" inputmode="decimal" style="height: 52px; border-radius: 20px; border: 1px solid #e8e8ed; background: #ffffff; padding: 0 16px; font-family: inherit; font-size: 16px; font-weight: 600; color: #111113; box-sizing: border-box; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-saji" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #6e6e73">Takaran saji</label>
<input id="m-saji" placeholder="ml" inputmode="decimal" style="height: 52px; border-radius: 20px; border: 1px solid #e8e8ed; background: #ffffff; padding: 0 16px; font-family: inherit; font-size: 16px; font-weight: 600; color: #111113; box-sizing: border-box; min-width: 0">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="m-isi" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #6e6e73">Isi bersih kemasan</label>
<input id="m-isi" placeholder="ml" inputmode="decimal" style="height: 52px; border-radius: 20px; border: 1px solid #e8e8ed; background: #ffffff; padding: 0 16px; font-family: inherit; font-size: 16px; font-weight: 600; color: #111113; box-sizing: border-box">
</div>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="Hasil.html" style="height: 56px; border-radius: 20px; background: #111113; color: #ffffff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Catat</a>
<div style="align-self: center; font-size: 13px; line-height: 18px; font-weight: 600; color: #6e6e73">Disimpan untuk kamu saja</div>
</div>
</div>
</div>
</body>
</html>
